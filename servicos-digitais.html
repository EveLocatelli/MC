<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serviços digitais · Simulador App</title>

<!-- Mondrian via CDN -->
<link rel="stylesheet" href="https://mondrian.claro.com.br/vanilla/reset.css">
<link rel="stylesheet" href="https://mondrian.claro.com.br/tokens/claro-tokens-3.0.0.custom-properties.css">
<link rel="stylesheet" href="https://mondrian.claro.com.br/vanilla/mondrian-vanilla-6.0.7.css">
<link rel="stylesheet" href="https://mondrian.claro.com.br/icons/mondrian-icons-latest.css">

<style>
  /* ===== Tokens ===== */
  :root{
    --ink:#1f1d1d;
    --gray-dark:#525252;
    --gray-line:#dbdbdb;
    --red:#da291c;
    --white:#ffffff;
    --bg-canvas:#e9e9e9;
    --green-bg:#ddf9ed;
    --bg-light:#f8f8f8;
    --green-text:#006b4f;
    --warn-bg:#fffaad;
    --warn-text:#b84d01;
    --radius-xs:4px;
    --radius-sm:12px;
    --radius-pill:500px;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Roboto', sans-serif;
    background:var(--bg-canvas);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0;}

  /* ===== Moldura do app (simula viewport mobile) — mesmo padrão de ofertas-fibra.html ===== */
  .app-frame{
    width:100%;
    max-width:420px;
    height:100vh;
    margin:0 auto;
    background:var(--white);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  @media (min-width:421px) and (hover:hover) and (pointer:fine){
    body{display:flex;justify-content:center;padding:24px 0;}
    .app-frame{
      height:844px;
      border-radius:32px;
      box-shadow:0 24px 60px rgba(0,0,0,0.18);
    }
  }

  /* ===== Celular de verdade (toque): sem moldura, a tela ocupa o aparelho =====
     A moldura de 420px com cantos e sombra só existe para simular um celular
     no desktop (mouse). Em dispositivo touch o layout se adapta à tela, sem
     moldura e sem a barra de status falsa (o aparelho já tem a dele). */
  @media (hover:none), (pointer:coarse){
    body{display:block;padding:0;}
    .app-frame{
      max-width:none;
      width:100%;
      margin:0;
      border-radius:0;
      box-shadow:none;
      height:100vh;
      height:100dvh;
    }
    .status-bar{display:none !important;}
  }

  /* ===== Status bar (mock do SO) ===== */
  .status-bar{
    height:44px;
    padding:0 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--white);
    flex-shrink:0;
  }
  .status-bar .time{
    font-family:'AMX',sans-serif;
    font-weight:500;
    font-size:14px;
    color:var(--ink);
  }
  .status-bar .icons{display:flex;align-items:center;gap:6px;}
  .status-bar .icons img{display:block;height:14px;width:auto;}
  .status-bar .icons img.battery{height:12px;}

  /* ===== Área rolável (app bar fica grudada no topo dela) ===== */
  .scroll-area{
    flex:1;
    min-height:0;
    overflow-y:auto;
    /* Fallback estático (o JS no fim do arquivo mede a altura real do
       .button-wrapper e substitui esse valor — ver ajustarEspacoRodape()).
       176px é a altura medida com os 2 botões; deixando uma folga aqui. */
    padding-bottom:0;
  }

  .app-bar{
    position:sticky;
    top:0;
    z-index:5;
    background:var(--white);
    display:flex;
    align-items:center;
    gap:16px;
    padding:24px 16px;
  }
  .app-bar .back-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:24px;
    height:24px;
    color:var(--ink);
    flex-shrink:0;
  }
  .app-bar h1{
    margin:0;
    font-family:'AMX',sans-serif;
    font-weight:500;
    font-size:16px;
    line-height:1.3;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }


  .app-bar .back-btn{display:flex;align-items:center;justify-content:center;width:24px;height:24px;color:var(--ink);flex-shrink:0;}
  .divider{height:1px;background:var(--gray-line);flex-shrink:0;}
  .marcas{display:flex;align-items:center;}
  .marcas img{width:32px;height:32px;display:block;margin-right:-4px;}
  .marcas img:last-child{margin-right:0;}

  .app-bar{padding:24px 16px;}
  .app{display:flex;align-items:center;gap:24px;padding:16px;}
  .app img{width:44px;height:44px;flex-shrink:0;display:block;}
  .app .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;font-weight:500;line-height:1.3;}
  .app .tx .n{margin:0;font-size:16px;color:var(--ink);}
  .app .tx .d{margin:0;font-size:12px;color:var(--gray-dark);}
  .voltar-bar{position:absolute;left:0;right:0;bottom:0;z-index:10;background:var(--white);padding:24px 16px 32px;}
  .btn-primary{
    width:100%;height:48px;border-radius:var(--radius-pill);background:var(--red);color:var(--white);
    display:flex;align-items:center;justify-content:center;
    font-weight:500;font-size:16px;line-height:1.3;transition:filter .2s cubic-bezier(0.2,0,0,1);
  }
  @media (hover:hover){.btn-primary:hover{filter:brightness(0.9);}}
  .btn-primary:active{transform:scale(0.99);}
</style>
</head>
<body>

<div class="app-frame">
  <div class="status-bar">
    <span class="time">5:13</span>
    <div class="icons">
      <img src="assets/statusbar/alarm.svg" alt="">
      <img src="assets/statusbar/bluetooth.svg" alt="">
      <img src="assets/statusbar/wifi.svg" alt="">
      <img src="assets/statusbar/signal.svg" alt="">
      <img class="battery" src="assets/statusbar/battery.svg" alt="">
    </div>
  </div>

  <div class="scroll-area" id="scrollArea">
    <div class="app-bar">
      <button type="button" class="back-btn" id="backBtn" aria-label="Voltar">
        <span class="mdn-Icon-seta-esquerda mdn-Icon--md" aria-hidden="true"></span>
      </button>
      <h1>Serviços digitais</h1>
    </div>
    <div id="lista"></div>
  </div>

  <div class="voltar-bar" id="voltarBar">
    <button type="button" class="btn-primary" id="voltarBtn">Voltar</button>
  </div>
</div>

<script src="https://mondrian.claro.com.br/vanilla/mondrian-vanilla-6.0.7.js"></script>
<script src="app-versions.js"></script>
<script src="app-catalog.js"></script>
<script>
  const catalog = window.APP_CATALOG;
  const $ = (id) => document.getElementById(id);
  const produtoId = new URLSearchParams(location.search).get('produto');
  const produto = (catalog.produtos && catalog.produtos[produtoId])
    || catalog.produtos[catalog.paginas['ofertas-fibra'].produtos[0]];
  const apps = (produto.maisDetalhes && produto.maisDetalhes.apps) || produto.marcas || [];
  const info = catalog.appsInfo || {};

  // Um bloco por app do plano, na ordem da planilha; nome e descrição vêm da aba "Apps e serviços (V2)"
  $('lista').innerHTML = apps.map((m, i) => `
    ${i ? '<div class="divider"></div>' : ''}
    <div class="app"${i === apps.length - 1 ? ' style="padding-bottom:32px"' : ''}>
      <img src="${m.src}" alt="${m.nome}">
      <div class="tx"><p class="n"></p><p class="d"></p></div>
    </div>`).join('');
  $('lista').querySelectorAll('.app').forEach((el, i) => {
    const dados = info[apps[i].nome.toLowerCase()] || { nome: apps[i].nome, descricao: '' };
    el.querySelector('.n').textContent = dados.nome;
    el.querySelector('.d').textContent = dados.descricao;
  });

  const voltar = () => { if (history.length > 1) history.back(); else location.href = 'mais-detalhes.html?produto=' + encodeURIComponent(produto.id); };
  $('backBtn').addEventListener('click', voltar);
  $('voltarBtn').addEventListener('click', voltar);
  function ajustar() { $('scrollArea').style.paddingBottom = ($('voltarBar').offsetHeight + 16) + 'px'; }
  ajustar(); window.addEventListener('resize', ajustar);
</script>
</body>
</html>
