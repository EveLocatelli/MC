<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protótipo App</title>
<style>
  :root{
    --red:#da291c;
    --red-dark:#b41e13;
    --ink:#1f1d1d;
    --gray-dark:#525252;
    --gray-line:#dbdbdb;
    --bg-page:#f8f8f8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    background:var(--bg-page);
    color:var(--ink);
  }
  header{
    background:linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
    color:#fff;
    padding:48px 24px;
    text-align:center;
  }
  header h1{margin:0 0 8px;font-size:28px;}
  header p{margin:0;opacity:0.9;font-size:15px;}
  .container{max-width:720px;margin:0 auto;padding:40px 24px;}
  .section-label{font-size:12px;font-weight:700;color:var(--gray-dark);text-transform:uppercase;letter-spacing:0.5px;margin:0 0 16px;}
  .link-list{
    display:flex;
    flex-direction:column;
    gap:12px;
    list-style:none;
    margin:0 0 40px;
    padding:0;
  }
  .link-list a{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    background:#fff;
    border:1px solid var(--gray-line);
    border-radius:12px;
    padding:20px 24px;
    text-decoration:none;
    color:inherit;
    font-size:16px;
    font-weight:500;
    transition:box-shadow 0.2s, transform 0.15s;
  }
  .link-list a:hover{box-shadow:0 8px 24px rgba(0,0,0,0.1);transform:translateY(-2px);}
  .link-list a .arrow{color:var(--red);font-size:18px;flex-shrink:0;}

  /* ===== Seletor de versão da jornada ===== */
  .versoes{display:flex;flex-direction:column;gap:12px;margin:0 0 16px;}
  .versao{
    display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border:1px solid var(--gray-line);
    border-radius:12px;padding:20px 24px;text-decoration:none;color:inherit;transition:box-shadow .2s, transform .15s;
  }
  .versao:hover{box-shadow:0 8px 24px rgba(0,0,0,0.1);transform:translateY(-2px);}
  .versao .nome{font-size:16px;font-weight:600;margin:0 0 4px;}
  .versao .desc{margin:0;font-size:14px;color:var(--gray-dark);}
  .versao .arrow{color:var(--red);font-size:18px;flex-shrink:0;}
  .ajuda{margin:-8px 0 16px;font-size:14px;color:var(--gray-dark);}
  .teste .lados{margin:8px 0 0;font-size:13px;color:var(--gray-dark);}
  .opcoes{display:flex;align-items:center;gap:8px;margin:0 0 40px;font-size:14px;color:var(--gray-dark);}
  .opcoes input{accent-color:var(--red);width:16px;height:16px;}
</style>
</head>
<body>

<header>
  <h1>Protótipo App</h1>
  <p>Ponto de partida do projeto</p>
</header>

<div class="container">
  <p class="section-label">Escolha a versão para iniciar a jornada</p>
  <div class="versoes" id="versoes"></div>
  <label class="opcoes"><input type="checkbox" id="mostrarSelo"> Mostrar selo da versão nas telas</label>

  <p class="section-label">Testes A/B — comparar lado a lado</p>
  <p class="ajuda">Cada teste abre dois celulares independentes, um ao lado do outro, para navegar e comparar as versões ao mesmo tempo.</p>
  <div class="versoes" id="testes"></div>
</div>

<script src="app-versions.js"></script>
<script src="ab-testes.js"></script>
<script>
  // Cada versão é um link que abre a jornada em uma nova aba; o ?v= define a versão nessa aba
  // (a escolha fica guardada na sessão da própria aba, lida em app-versions.js).
  var box = document.getElementById('versoes');
  Object.keys(window.APP_VERSOES).forEach(function (id) {
    var v = window.APP_VERSOES[id];
    if (v.oculta) return; // versões B dos testes só aparecem na comparação
    var link = document.createElement('a');
    link.className = 'versao';
    link.href = 'ofertas-fibra.html?v=' + encodeURIComponent(id);
    link.target = '_blank';
    link.rel = 'noopener';
    link.innerHTML = '<div><p class="nome"></p><p class="desc"></p></div><span class="arrow" aria-hidden="true">→</span>';
    link.querySelector('.nome').textContent = v.nome;
    link.querySelector('.desc').textContent = v.descricao;
    box.appendChild(link);
  });
  // Testes A/B: cada cartão abre comparar.html (dois frames independentes) em nova aba
  var caixaTestes = document.getElementById('testes');
  (window.AB_TESTES || []).forEach(function (t) {
    var nomeV = function (id) { return (window.APP_VERSOES[id] || { nome: id }).nome; };
    var link = document.createElement('a');
    link.className = 'versao teste';
    link.href = 'comparar.html?teste=' + encodeURIComponent(t.id);
    link.target = '_blank';
    link.rel = 'noopener';
    link.innerHTML = '<div><p class="nome"></p><p class="desc"></p><p class="lados"></p></div><span class="arrow" aria-hidden="true">→</span>';
    link.querySelector('.nome').textContent = t.nome;
    link.querySelector('.desc').textContent = t.descricao;
    link.querySelector('.lados').textContent = 'A: ' + t.a.rotulo + ' (' + nomeV(t.a.versao) + ')  ·  B: ' + t.b.rotulo + ' (' + nomeV(t.b.versao) + ')';
    caixaTestes.appendChild(link);
  });
  var selo = document.getElementById('mostrarSelo');
  try { selo.checked = localStorage.getItem('appMostrarSelo') !== '0'; } catch (e) { selo.checked = true; }
  selo.addEventListener('change', function () { window.setMostrarSelo(selo.checked); });
</script>

</body>
</html>
